<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple to-do list app." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Todo Lists</title>
  </head>
  <body>
    <nav>
      <header ><span class="header"></span> My Notebook</header>
    </nav>

    <main>
      <div class="content"></div>
      <div class="todoList"></div>
    </main>

    <dialog class="listInput">
      <header class="dialogHeader">
        <h2>New Todo List</h2>
      </header>

      <form class="userDetails" method="post">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" required autofocus />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" />
        </div>

        <div class="field">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" />
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option class="Low">Low</option>
            <option class="Medium" selected>Medium</option>
            <option class="High">High</option>
          </select>
        </div>

        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="4"></textarea>
        </div>
      </form>
    </dialog>
  </body>
</html>
